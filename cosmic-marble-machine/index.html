<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cosmic Marble Machine</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#08091e;color:white;
  font-family:system-ui,sans-serif}
canvas{display:block;touch-action:none}
header{position:absolute;top:24px;left:28px;pointer-events:none}
header small{color:#93ddff;letter-spacing:3px;font-weight:700}
h1{font-size:clamp(20px,4vw,36px);margin:8px 0}
#caption{position:absolute;bottom:90px;width:100%;text-align:center;
  font-size:clamp(18px,3vw,26px);text-shadow:0 2px 12px #000;
  pointer-events:none}
#magic{position:absolute;inset:0;display:grid;place-content:center;
  text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#magic strong{font-size:clamp(38px,8vw,100px);line-height:1;
  color:#fff5ae;text-shadow:0 0 25px #ff6ac8,0 0 80px #704bff}
#magic span{margin-top:20px;font-size:20px}
footer{position:absolute;bottom:25px;left:24px;right:24px;
  display:flex;align-items:center;gap:12px}
button{border:1px solid #ffffff40;border-radius:24px;padding:12px 18px;
  background:#171a40cc;color:white;font:inherit;cursor:pointer}
button:hover{background:#323366}
#hint{font-size:13px;color:#c4c9ec;margin-left:auto}
#progress{position:absolute;bottom:0;height:4px;background:
  linear-gradient(90deg,#67ffff,#b076ff,#ff8cac);width:0}
#error{position:absolute;inset:0;display:none;place-content:center;
  padding:32px;text-align:center;background:#08091e}
</style>
</head>
<body>
<header><small>A LITTLE WONDER, IN 30 SECONDS</small>
<h1>The Cosmic Marble Machine</h1></header>
<div id="caption">Every adventure starts with a little spark.</div>
<div id="magic"><strong>YOU ARE<br>THE MAGIC!</strong>
<span>Keep imagining. Keep exploring.</span></div>
<footer>
<button id="sound">Sound: off</button>
<button id="replay">Start again ↻</button>
<span id="hint">Tap anywhere to make stardust</span>
</footer>
<div id="progress"></div>
<div id="error">The adventure couldn't start.<br>
Check your internet connection and that your browser supports WebGL.</div>

<script type="module">
try {
const THREE = await import(
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'
);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#08091e');
scene.fog = new THREE.FogExp2('#08091e', .013);
const camera = new THREE.PerspectiveCamera(
  48, innerWidth / innerHeight, .1, 160
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.prepend(renderer.domElement);

scene.add(new THREE.AmbientLight('#b6c8ff', 1.7));
const key = new THREE.DirectionalLight('#fff1d0', 3);
key.position.set(5,10,8); scene.add(key);
const pink = new THREE.PointLight('#ff75db', 90, 25);
pink.position.set(-5,5,4); scene.add(pink);

const palette = [0xff7ecb,0xffc66d,0xffff8a,0x73ffc9,0x72dcff,0xb49aff];
const v = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp = THREE.MathUtils.clamp;
const smooth = x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function material(color, glow=0) {
  return new THREE.MeshStandardMaterial({
    color,roughness:.3,metalness:.2,emissive:color,
    emissiveIntensity:glow
  });
}
function mesh(geometry, color, parent=scene, glow=0) {
  const m=new THREE.Mesh(geometry,material(color,glow));
  parent.add(m);return m;
}
const sphere = new THREE.SphereGeometry(1,32,24);

// Star field
const starPositions=new Float32Array(1200*3);
for(let i=0;i<1200;i++) {
  starPositions[i*3]=(Math.random()-.5)*130;
  starPositions[i*3+1]=(Math.random()-.5)*90;
  starPositions[i*3+2]=(Math.random()-.5)*100;
}
const starGeometry=new THREE.BufferGeometry();
starGeometry.setAttribute('position',
  new THREE.BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeometry,
  new THREE.PointsMaterial({color:0xc6d4ff,size:.11}));
scene.add(stars);

// A ribbon coaster with six luminous rails
function trackAt(u) {
  return v(-9+18*u,
    1.5+1.9*Math.sin(u*Math.PI*3),
    -2.5*Math.sin(u*Math.PI*2));
}
const points=Array.from({length:101},(_,i)=>trackAt(i/100));
const coaster=new THREE.Group();scene.add(coaster);
palette.forEach((color,i)=>{
  const curve=new THREE.CatmullRomCurve3(
    points.map(p=>p.clone().add(v(0,-.9,(i-2.5)*.22)))
  );
  mesh(new THREE.TubeGeometry(curve,160,.075,8,false),
    color,coaster,.65);
});
for(let i=0;i<24;i++) {
  const p=trackAt(i/23);
  const tie=mesh(new THREE.BoxGeometry(.13,.1,1.5),
    0xa0b6fa,coaster);
  tie.position.copy(p).add(v(0,-1,0));
}

// Floating islands
const islands=[];
for(let i=0;i<9;i++) {
  const island=new THREE.Group();
  island.position.set(-13+i*3.2,-4-Math.random()*2,-5-Math.random()*5);
  const rock=mesh(new THREE.ConeGeometry(1.5,2.8,7),0x6455a5,island);
  rock.rotation.z=Math.PI;
  const grass=mesh(new THREE.CylinderGeometry(1.5,1.5,.25,16),
    palette[i%6],island,.12);
  grass.position.y=1.35;
  const trunk=mesh(new THREE.CylinderGeometry(.08,.13,1,8),
    0xa68cbb,island);
  trunk.position.y=1.95;
  const crown=mesh(new THREE.IcosahedronGeometry(.65,0),
    palette[(i+3)%6],island,.2);
  crown.position.y=2.6;
  scene.add(island);islands.push(island);
}

// The marble's face
const hero=new THREE.Group();scene.add(hero);
const body=mesh(sphere,0x79eaff,hero,.4);
const eyes=[];
for(const x of [-.32,.32]) {
  const eye=new THREE.Group();eye.position.set(x,.22,.86);
  const white=mesh(sphere,0xffffff,eye);
  white.scale.set(.23,.29,.12);
  const pupil=mesh(sphere,0x17203a,eye);
  pupil.position.set(.035,0,.1);pupil.scale.set(.105,.145,.07);
  hero.add(eye);eyes.push(eye);
}
const smileCurve=new THREE.CatmullRomCurve3([
  v(-.28,-.23,.94),v(0,-.36,.96),v(.28,-.23,.94)
]);
mesh(new THREE.TubeGeometry(smileCurve,20,.035,8,false),
  0x183857,hero);

// Dragon parts grow out of the marble
const dragon=new THREE.Group();hero.add(dragon);
const snout=mesh(sphere,0x8effd1,dragon,.2);
snout.position.set(0,-.1,.92);snout.scale.set(.55,.35,.45);
for(const x of [-.48,.48]) {
  const horn=mesh(new THREE.ConeGeometry(.15,.5,8),
    0xffe69c,dragon,.3);
  horn.position.set(x,.95,0);
  horn.rotation.z=-x*.4;
}
for(let i=0;i<5;i++) {
  const tail=mesh(sphere,0x75e6ba,dragon,.2);
  tail.position.set(Math.sin(i*.5)*.35,-i*.08,-.8-i*.35);
  tail.scale.setScalar(.42-i*.065);
}
const wings=[];
for(const side of [-1,1]) {
  const wing=new THREE.Group();wing.position.set(side*.65,.15,-.15);
  const shape=new THREE.Shape();
  shape.moveTo(0,0);shape.lineTo(side*1.8,1.15);
  shape.lineTo(side*1.45,-.25);shape.lineTo(side*.85,.05);
  shape.lineTo(side*.35,-.4);shape.closePath();
  const membrane=new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({
      color:0xc9a0ff,emissive:0x8248dd,emissiveIntensity:.45,
      side:THREE.DoubleSide,roughness:.5
    }));
  wing.add(membrane);dragon.add(wing);wings.push(wing);
}

// Musical mushrooms
const mushrooms=new THREE.Group();scene.add(mushrooms);
const shrooms=[];
for(let i=0;i<6;i++) {
  const g=new THREE.Group();g.position.set(-8+i*3.2,-.6,1);
  const stem=mesh(new THREE.CylinderGeometry(.25,.4,2.4,12),
    0xf2dcff,g);
  stem.position.y=-1.2;
  const cap=mesh(new THREE.SphereGeometry(1,32,16,0,
    Math.PI*2,0,Math.PI/2),palette[i],g,.3);
  cap.scale.set(1.15,.65,1.15);
  for(let j=0;j<6;j++) {
    const a=j*Math.PI/3;
    const dot=mesh(sphere,0xffffff,g,.1);
    dot.position.set(Math.cos(a)*.7,.42,Math.sin(a)*.7);
    dot.scale.set(.15,.06,.15);
  }
  mushrooms.add(g);shrooms.push(g);
}

// Star gates
const gates=new THREE.Group();scene.add(gates);
for(let i=0;i<4;i++) {
  const g=new THREE.Group();g.position.set(-7+i*4,3,0);
  const ring=mesh(new THREE.TorusGeometry(1.8,.065,8,64),
    palette[(i+2)%6],g,1.2);
  ring.rotation.y=Math.PI/2;
  for(let j=0;j<10;j++) {
    const a=j*Math.PI/5;
    const star=mesh(new THREE.OctahedronGeometry(.18),
      0xffe99b,g,1);
    star.position.set(0,Math.cos(a)*1.8,Math.sin(a)*1.8);
  }
  gates.add(g);
}

// Reusable particles
const count=650;
const particlePos=new Float32Array(count*3);
const particleColor=new Float32Array(count*3);
const particles=Array.from({length:count},()=>({
  life:0,max:1,velocity:v()
}));
const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(particlePos,3));
pg.setAttribute('color',new THREE.BufferAttribute(particleColor,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({
  size:.14,vertexColors:true,transparent:true,opacity:.85,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(dust);
let cursor=0;
function burst(pos,n=35,speed=2) {
  for(let i=0;i<n;i++) {
    const k=cursor++%count,p=particles[k];
    p.life=p.max=.5+Math.random()*1.3;
    p.velocity.set((Math.random()-.5)*speed,
      (Math.random()-.3)*speed,(Math.random()-.5)*speed);
    pos.toArray(particlePos,k*3);
    new THREE.Color(palette[Math.floor(Math.random()*6)])
      .toArray(particleColor,k*3);
  }
}
const ripples=[];
const rippleGeometry=new THREE.TorusGeometry(1,.035,8,48);
function ripple(pos,color) {
  const m=new THREE.Mesh(rippleGeometry,
    new THREE.MeshBasicMaterial({color,transparent:true}));
  m.rotation.x=Math.PI/2;m.position.copy(pos);scene.add(m);
  ripples.push({mesh:m,life:1});
}

// Sound, enabled only by a button gesture
let audio=null,sound=false;
const frequencies=[261.63,329.63,392,523.25,659.25,783.99];
function note(f,duration=.35) {
  if(!audio||!sound||audio.state!=='running')return;
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type='sine';osc.frequency.value=f;
  gain.gain.setValueAtTime(0,audio.currentTime);
  gain.gain.linearRampToValueAtTime(.09,audio.currentTime+.015);
  gain.gain.exponentialRampToValueAtTime(.001,
    audio.currentTime+duration);
  osc.connect(gain);gain.connect(audio.destination);
  osc.start();osc.stop(audio.currentTime+duration+.03);
}
document.querySelector('#sound').onclick=async()=>{
  try {
    audio??=new (window.AudioContext||window.webkitAudioContext)();
    await audio.resume();sound=!sound;
    document.querySelector('#sound').textContent=
      `Sound: ${sound?'on':'off'}`;
    if(sound)note(523.25);
  } catch {
    document.querySelector('#sound').textContent='Sound unavailable';
  }
};
const raycaster=new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown',e=>{
  raycaster.setFromCamera(new THREE.Vector2(
    e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);
  const plane=new THREE.Plane(v(0,0,1),-hero.position.z);
  const hit=v();
  if(raycaster.ray.intersectPlane(plane,hit)) {
    burst(hit,70,5);note(frequencies[Math.floor(Math.random()*6)]);
  }
});

let elapsed=0,lastTime=performance.now(),lastBeat=-1,
  previousPhase=-1,trailTime=0;
document.querySelector('#replay').onclick=()=>{
  elapsed=0;lastBeat=-1;previousPhase=-1;
  particles.forEach(p=>p.life=0);
  ripples.forEach(r=>{
    scene.remove(r.mesh);r.mesh.material.dispose();
  });
  ripples.length=0;
};
const caption=document.querySelector('#caption');
const captions=[
  'Every adventure starts with a little spark.',
  'Next stop: the rainbow roller coaster!',
  'Boing! The mushrooms are making music.',
  'A little courage. A lot of dragon.',
  'The most magical thing here is you.'
];
const cameraTarget=v(),lookTarget=v(),desiredLook=v();
camera.position.set(-9,4,12);
let lastFrame=performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastFrame)/1000,.05);
  lastFrame=now;
  if(!document.hidden)elapsed+=Math.min((now-lastTime)/1000,.1);
  lastTime=now;
  const t=elapsed%30;
  const phase=t<5?0:t<12?1:t<20?2:t<26?3:4;
  if(phase!==previousPhase) {
    caption.textContent=captions[phase];previousPhase=phase;
    if(phase===4) {
      burst(hero.position,220,7);
      [523.25,659.25,783.99].forEach(f=>note(f,.9));
    }
  }
  coaster.visible=phase<2;
  mushrooms.visible=phase===2;
  gates.visible=phase===3;
  hero.rotation.set(0,0,0);
  hero.scale.setScalar(1);
  dragon.scale.setScalar(0);
  eyes.forEach(e=>e.scale.y=1);

  if(phase===0) {
    hero.position.copy(trackAt(0));
    hero.position.y+=Math.sin(t*2)*.12;
    const waking=smooth(t/1.3);
    eyes.forEach(e=>e.scale.y=.07+.93*waking);
    if(t>2.4&&t<3)eyes[1].scale.y=.08;
    hero.scale.setScalar(1+Math.sin(t*3)*.035);
    cameraTarget.copy(hero.position).add(v(2,2.3,12));
  } else if(phase===1) {
    const u=(t-5)/7;
    hero.position.copy(trackAt(u));
    hero.rotation.z=-Math.cos(u*Math.PI*3)*.2;
    cameraTarget.copy(hero.position).add(v(2,3,12));
  } else if(phase===2) {
    const q=(t-12)/8*6;
    const index=Math.min(5,Math.floor(q));
    const f=q-index;
    hero.position.set(-8+Math.min(q,5)*3.2,
      .95+Math.sin(f*Math.PI)*2.5,1);
    hero.rotation.z=Math.sin(f*Math.PI)*.25;
    if(index!==lastBeat) {
      lastBeat=index;note(frequencies[index]);
      ripple(shrooms[index].position.clone().add(v(0,.15,0)),
        palette[index]);
      burst(shrooms[index].position,35,2);
    }
    shrooms.forEach((g,i)=>{
      const squash=i===index?Math.exp(-f*12)*.18:0;
      g.scale.set(1+squash,1-squash,1+squash);
    });
    cameraTarget.copy(hero.position).add(v(1,3,13));
  } else if(phase===3) {
    const u=(t-20)/6;
    hero.position.set(-10+20*u,3+Math.sin(u*Math.PI*4)*.4,0);
    dragon.scale.setScalar(smooth((t-20)/.8));
    hero.rotation.z=-.12;
    wings.forEach((w,i)=>{
      w.rotation.y=Math.sin(t*12)*(i===0?1:-1)*.7;
    });
    cameraTarget.copy(hero.position).add(v(2,2,12));
  } else {
    const u=(t-26)/4;
    hero.position.copy(v(10,3,0).lerp(trackAt(0),smooth(u)));
    dragon.scale.setScalar(1-smooth((u-.45)/.4));
    hero.rotation.x=Math.sin(clamp(u/.4,0,1)*Math.PI)*.4;
    wings.forEach((w,i)=>{
      w.rotation.y=Math.sin(t*8)*(i===0?1:-1)*.4;
    });
    cameraTarget.copy(hero.position).add(v(2,2.3,12));
  }

  desiredLook.copy(hero.position);
  camera.position.lerp(cameraTarget,1-Math.exp(-dt*3));
  lookTarget.lerp(desiredLook,1-Math.exp(-dt*5));
  camera.lookAt(lookTarget);
  pink.position.copy(hero.position).add(v(-3,3,3));
  stars.rotation.y=elapsed*.012;
  islands.forEach((g,i)=>{
    g.rotation.y=Math.sin(elapsed*.25+i)*.12;
  });
  gates.children.forEach((g,i)=>g.rotation.x=elapsed*.25+i);

  trailTime+=dt;
  if(trailTime>.045) {
    trailTime=0;
    if(phase>0&&phase<4)burst(hero.position,4,.7);
  }
  for(let i=0;i<count;i++) {
    const p=particles[i];
    if(p.life>0) {
      p.life-=dt;
      particlePos[i*3]+=p.velocity.x*dt;
      particlePos[i*3+1]+=p.velocity.y*dt;
      particlePos[i*3+2]+=p.velocity.z*dt;
      p.velocity.y-=dt*.4;
      const c=new THREE.Color(palette[i%6]);
      c.multiplyScalar(Math.max(0,p.life/p.max));
      c.toArray(particleColor,i*3);
    } else {
      particlePos[i*3+1]=-1000;
    }
  }
  pg.attributes.position.needsUpdate=true;
  pg.attributes.color.needsUpdate=true;
  for(let i=ripples.length-1;i>=0;i--) {
    const r=ripples[i];r.life-=dt;
    r.mesh.scale.setScalar(1+(1-r.life)*5);
    r.mesh.material.opacity=Math.max(0,r.life);
    if(r.life<=0) {
      scene.remove(r.mesh);r.mesh.material.dispose();ripples.splice(i,1);
    }
  }
  document.querySelector('#magic').style.opacity=
    phase===4&&t<29.4?'1':'0';
  document.querySelector('#progress').style.width=`${t/30*100}%`;
  renderer.render(scene,camera);
}
document.addEventListener('visibilitychange',()=>{
  lastTime=performance.now();lastFrame=lastTime;
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
hero.position.copy(trackAt(0));lookTarget.copy(hero.position);
requestAnimationFrame(animate);
} catch(error) {
  console.error(error);
  document.querySelector('#error').style.display='grid';
}
</script>
</body>
</html>
